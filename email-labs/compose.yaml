name: email-hunt-lab

services:
  email-hunt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - email-hunt-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  email-hunt-data:
    name: email-hunt-data
